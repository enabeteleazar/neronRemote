# Config de l'agent pc_remote (a copier en config.yaml a cote de agent.py).
#
# Le token n'est JAMAIS ici : il vient de la variable d'environnement
# PC_AGENT_TOKEN (voir .env.example). Ne l'ajoutez pas a ce fichier.
#
# `host` DOIT etre l'IP (ou nom MagicDNS) Tailscale de cette machine
# (100.x.x.x), jamais 0.0.0.0 : Tailscale chiffre deja le tunnel, mais
# binder sur toutes les interfaces exposerait ce port a tout le LAN/Internet
# sans ce chiffrement, protege alors par le seul token.
host: "100.64.0.5"
port: 8765

# Auto-discovery : le registre App Paths et les raccourcis du Menu Demarrer
# sont scannes a chaque requete, rendant automatiquement ouvrable/fermable
# toute application installee normalement (voir discovery.py) — sans rien
# declarer ici. Seule exception : une liste fixe de commandes destructrices
# (cmd, powershell, shutdown, reg, net, sc, taskkill...) reste exclue quoi
# qu'il arrive, voir discovery.DANGEROUS_NAMES.
#
# `apps` ci-dessous sert uniquement pour deux cas que l'auto-discovery ne
# couvre pas : forcer un `path`/`process_name` precis pour un id, ou ajouter
# une app absente d'App Paths et du Menu Demarrer (ex. un executable portable
# sans raccourci). Une entree ici l'emporte toujours sur celle
# auto-decouverte pour le meme id.
apps:
  portable_tool:
    path: "C:\\Tools\\portable_tool.exe"
    process_name: "portable_tool.exe"
