# Config de l'agent pc_remote (a copier en config.yaml a cote de agent.py).
#
# Le token n'est JAMAIS ici : il vient de la variable d'environnement
# PC_AGENT_TOKEN (voir .env.example). Ne l'ajoutez pas a ce fichier.
#
# `host` DOIT etre l'IP (ou nom MagicDNS) Tailscale de cette machine
# (100.x.x.x), jamais 0.0.0.0 : Tailscale chiffre deja le tunnel, mais
# binder sur toutes les interfaces exposerait ce port a tout le LAN/Internet
# sans ce chiffrement, protege alors par le seul token.
host: "100.64.0.6"
port: 8765

# Auto-discovery : tout binaire executable trouve sur $PATH devient
# automatiquement ouvrable/fermable, sans rien declarer ici (voir
# discovery.py). Seule exception : une liste fixe de commandes destructrices
# (shutdown, rm, systemctl, passwd, sudo...) reste exclue quoi qu'il arrive —
# voir discovery.DANGEROUS_NAMES.
#
# `apps` ci-dessous sert uniquement pour deux cas que l'auto-discovery ne
# couvre pas : forcer un `path`/`process_name` precis pour un id, ou ajouter
# un script hors PATH (ex. backup_script). Une entree ici l'emporte toujours
# sur celle auto-decouverte pour le meme id.
#
# Un serveur Ubuntu est generalement headless (pas de session graphique) :
# les binaires auto-decouverts sont surtout des outils CLI. Pour piloter une
# appli graphique, la machine doit avoir une session X11/Wayland active et
# la variable DISPLAY exportee pour le process qui execute cet agent.
apps:
  backup_script:
    path: "/opt/scripts/backup.sh"
    process_name: "backup.sh"
